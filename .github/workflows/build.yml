name: Build Morph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (parser, ledger, learning, budgets)
        run: ./gradlew :core:test --no-daemon

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.MORPH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing key missing. Add the four MORPH_* secrets described in docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/morph.jks"
          echo "MORPH_KEYSTORE=$RUNNER_TEMP/morph.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          MORPH_KEYSTORE_PASSWORD: ${{ secrets.MORPH_KEYSTORE_PASSWORD }}
          MORPH_KEY_ALIAS: ${{ secrets.MORPH_KEY_ALIAS }}
          MORPH_KEY_PASSWORD: ${{ secrets.MORPH_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "morph-$V.apk"
          git log -1 --pretty=%B > notes.txt
          gh release create "v$V" "morph-$V.apk" --title "Morph $V" --notes-file notes.txt
